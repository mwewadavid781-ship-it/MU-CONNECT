<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard | Muconnect</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <div class="logo"><a href="index.html" style="color:inherit; text-decoration:none;">⚡ MUCONNECT<span>.</span></a></div>
    <div style="font-size: 0.85rem; color: #94a3b8;">Seller Hub</div>
  </header>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h2>Store Management</h2>
      <button id="newProductBtn" class="btn">+ Add New Product</button>
    </div>

    <!-- Store Summary Banner -->
    <div class="card" style="margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: space-between; align-items: center;">
      <div>
        <h3 id="storeNameDisplay" style="color: var(--accent);">Loading Store...</h3>
        <p id="storeCampusDisplay" style="margin-bottom: 0;">Mulungushi University</p>
      </div>
      <div style="display: flex; gap: 1rem;">
        <div style="background: var(--bg-color); padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid var(--border); text-align: center;">
          <div style="font-size: 0.75rem; color: var(--text-muted);">Active Products</div>
          <div id="productCount" style="font-size: 1.25rem; font-weight: bold;">0</div>
        </div>
        <div style="background: var(--bg-color); padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid var(--border); text-align: center;">
          <div style="font-size: 0.75rem; color: var(--text-muted);">Platform Status</div>
          <div style="font-size: 0.95rem; font-weight: bold; color: #10b981;">Verified</div>
        </div>
      </div>
    </div>

    <!-- Add Product Modal / Inline Form -->
    <div id="productFormCard" class="card" style="display: none; margin-bottom: 2rem; border-color: var(--accent);">
      <h3 style="margin-bottom: 1rem;">Add Product to Store</h3>
      <form id="addProductForm" style="display: grid; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Product Name</label>
          <input type="text" id="prodName" style="width: 100%; padding: 0.6rem; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 6px;" placeholder="e.g., Spicy Chicken Wings" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Price (ZMW)</label>
            <input type="number" step="0.01" id="prodPrice" style="width: 100%; padding: 0.6rem; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 6px;" placeholder="50.00" required>
          </div>
          <div>
            <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Category</label>
            <select id="prodCategory" style="width: 100%; padding: 0.6rem; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 6px;">
              <option value="Food">Food</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Services">Services</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">Description</label>
          <textarea id="prodDesc" rows="3" style="width: 100%; padding: 0.6rem; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 6px;" placeholder="Brief details about the product..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" id="cancelProdBtn" style="padding: 0.6rem 1.2rem; background: transparent; border: 1px solid var(--border); color: white; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" class="btn">Save Product</button>
        </div>
      </form>
    </div>

    <!-- Active Storefront Inventory List -->
    <h3>Your Products</h3>
    <div id="sellerProductGrid" class="grid-2" style="margin-top: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));">
      <p style="color: var(--text-muted);">Loading inventory...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Muconnect • AHAK DEV × TEKARU</p>
  </footer>

  <script src="assets/js/seller.js"></script>
</body>
</html>
